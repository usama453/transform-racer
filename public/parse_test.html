<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main.js Parse Test</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #00ff88; padding: 20px; font-size: 12px; }
    .pass { color: #00ff88; }
    .fail { color: #ff4444; }
    #log { background: #000; padding: 10px; white-space: pre-wrap; margin-top: 10px; }
  </style>
  <script src="/libsio/socket.io.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Main.js Parse Test</h1>
  <div id="log">Testing...</div>

  <div id="hud" style="display:none">
    <div id="players-online">0</div>
    <button id="sound-toggle">&#128266;</button>
    <div id="speedometer"><div id="speed-num">0</div><div id="speed-unit">km/h</div></div>
    <div id="health-panel"><div class="health-label">HULL</div><div id="health-bar"><div id="health-fill"></div></div></div>
    <div id="nitro-panel"><div class="nitro-label">NITRO</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
    <div id="shoot-indicator" class="ready">FIRE</div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="transform-hint">Press F</div>
    <div id="warning"></div>
    <div id="spawn-capture"></div>
    <div id="edge-tags"></div>
    <div id="kill-feed"></div>
    <div id="hit-flash"></div>
    <div id="chat-box"><div id="chat-log"></div><input id="chat-input" /></div>
  </div>
  <div id="start-overlay"></div>
  <input id="name-input" />
  <button id="join-btn">JOIN</button>
  <button id="screenshake-toggle">SHAKE</button>
  <div id="server-status" class="connecting">Connecting...</div>

  <script type="module">
    const log = [];
    function add(msg) {
      log.push(msg);
      document.getElementById('log').textContent = log.join('\n');
    }

    // Test 1: Try to fetch main.js as text first
    add('Test 1: Fetching main.js as text...');
    fetch('./js/main.js')
      .then(r => {
        add('  Status: ' + r.status);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(text => {
        add('  Content length: ' + text.length);
        add('  First 50 chars: ' + text.substring(0, 50));
        
        // Test 2: Try to parse as module
        add('Test 2: Parsing as module...');
        const blob = new Blob([text], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        return import(url);
      })
      .then(mod => {
        add('  PASS: Module loaded successfully!');
        add('  Module keys: ' + Object.keys(mod).join(', '));
      })
      .catch(err => {
        add('  FAIL: ' + err.message);
        add('  Stack: ' + (err.stack ? err.stack.split('\n').slice(0, 3).join(' | ') : 'none'));
      });
  </script>
</body>
</html>
