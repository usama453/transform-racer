<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Main Test</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #00ff88; padding: 20px; }
    #log { background: #000; padding: 10px; white-space: pre-wrap; }
  </style>
  <script src="/libsio/socket.io.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Minimal Main Test</h1>
  <div id="log">Loading...</div>

  <div id="hud" style="display:none">
    <div id="players-online">0</div>
    <button id="sound-toggle">&#128266;</button>
    <div id="speedometer"><div id="speed-num">0</div><div id="speed-unit">km/h</div></div>
    <div id="health-panel"><div class="health-label">HULL</div><div id="health-bar"><div id="health-fill"></div></div></div>
    <div id="nitro-panel"><div class="nitro-label">NITRO</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
    <div id="shoot-indicator" class="ready">FIRE</div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="transform-hint">Press F</div>
    <div id="warning"></div>
    <div id="spawn-capture"></div>
    <div id="edge-tags"></div>
    <div id="kill-feed"></div>
    <div id="hit-flash"></div>
    <div id="chat-box"><div id="chat-log"></div><input id="chat-input" /></div>
  </div>
  <div id="start-overlay"></div>
  <input id="name-input" />
  <button id="join-btn">JOIN</button>
  <button id="screenshake-toggle">SHAKE</button>
  <div id="server-status" class="connecting">Connecting...</div>

  <script>
    const log = [];
    function add(msg) {
      log.push(msg);
      document.getElementById('log').textContent = log.join('\n');
    }
    window.addEventListener('error', (e) => add('ERROR: ' + e.message));
    add('Page loaded');
  </script>
  <script type="module">
    // Inline module - same imports as main.js
    try {
      add('Module started');
      
      const THREE = await import('three');
      add('THREE imported');
      
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      add('GLTFLoader imported');
      
      const { Vehicle, PLANE_GROUND_Y, WORLD_RADIUS } = await import('./js/vehicle.js');
      add('vehicle.js imported');
      
      const { Input } = await import('./js/input.js');
      add('input.js imported');
      
      const { Network } = await import('./js/network.js');
      add('network.js imported');
      
      const { HUD } = await import('./js/hud.js');
      add('hud.js imported');
      
      const worldMod = await import('./js/world.js');
      add('world.js imported');
      
      const renderMod = await import('./js/render.js');
      add('render.js imported');
      
      const { SoundManager } = await import('./js/audio.js');
      add('audio.js imported');
      
      const { Minimap } = await import('./js/minimap.js');
      add('minimap.js imported');
      
      add('ALL DONE - Module executed successfully');
    } catch (e) {
      add('MODULE ERROR: ' + e.message);
      add('Stack: ' + (e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : 'none'));
    }
  </script>
</body>
</html>
