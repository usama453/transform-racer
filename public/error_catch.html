<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Module Load Error Catch</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #00ff88; padding: 20px; font-size: 12px; }
    .step { margin: 2px 0; padding: 3px 6px; border: 1px solid #333; border-radius: 3px; }
    .fail { border-color: #ff4444; background: rgba(255,68,68,0.1); color: #ff4444; }
    h1 { color: #fff; font-size: 14px; }
    #log { margin-top: 10px; white-space: pre-wrap; background: #000; padding: 10px; }
  </style>
  <script src="/libsio/socket.io.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Module Load Error Catch</h1>
  <div id="results">Loading...</div>
  <div id="log"></div>

  <div id="hud">
    <div id="players-online">0</div>
    <button id="sound-toggle">&#128266;</button>
    <div id="speedometer"><div id="speed-num">0</div><div id="speed-unit">km/h</div></div>
    <div id="health-panel"><div class="health-label">HULL</div><div id="health-bar"><div id="health-fill"></div></div></div>
    <div id="nitro-panel"><div class="nitro-label">NITRO</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
    <div id="shoot-indicator" class="ready">FIRE</div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="transform-hint">Press F</div>
    <div id="warning"></div>
    <div id="spawn-capture"></div>
    <div id="edge-tags"></div>
    <div id="kill-feed"></div>
    <div id="hit-flash"></div>
    <div id="chat-box"><div id="chat-log"></div><input id="chat-input" /></div>
  </div>
  <div id="start-overlay"></div>
  <input id="name-input" />
  <button id="join-btn">JOIN</button>
  <button id="screenshake-toggle">SHAKE</button>
  <div id="server-status" class="connecting">Connecting...</div>

  <script>
    const log = [];
    function add(msg) {
      log.push(msg);
      document.getElementById('log').textContent = log.join('\n');
    }

    // Catch unhandled errors
    window.addEventListener('error', (e) => {
      add('WINDOW ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      document.getElementById('results').innerHTML += '<div class="step fail">ERROR: ' + e.message + '</div>';
    });

    // Catch unhandled promise rejections
    window.addEventListener('unhandledrejection', (e) => {
      add('PROMISE REJECTION: ' + (e.reason ? e.reason.message : e.reason));
      document.getElementById('results').innerHTML += '<div class="step fail">PROMISE ERROR: ' + (e.reason ? e.reason.message : e.reason) + '</div>';
    });

    add('Page loaded');
    add('socket.io loaded: ' + (typeof io === 'function'));
  </script>
  <script type="module">
    // This runs inside module scope
    try {
      const THREE = await import('three');
      window.__log2 = window.__log2 || [];
      window.__log2.push('THREE imported: r' + THREE.REVISION);
      
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      window.__log2.push('GLTFLoader imported');
      
      window.__log2.push('About to import main.js imports...');
      
      // Now import main.js itself
      await import('./js/main.js');
      window.__log2.push('main.js imported successfully');
    } catch (e) {
      window.__log2 = window.__log2 || [];
      window.__log2.push('IMPORT ERROR: ' + e.message);
      window.__log2.push('Stack: ' + (e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : 'none'));
    }
    
    // Display results
    setTimeout(() => {
      const log2 = window.__log2 || ['No logs'];
      document.getElementById('log').textContent = log2.join('\n');
    }, 3000);
  </script>
</body>
</html>
