<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Model Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: #00ff88; font-family: monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">Loading model...</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const info = document.getElementById('info');
    
    // Setup scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(500, 300, 500);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    
    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    
    // Grid
    const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(grid);
    
    // Load car model
    info.textContent = 'Loading car.glb...';
    const loader = new GLTFLoader();
    
    loader.load(
      '/car.glb',
      (gltf) => {
        const car = gltf.scene;
        
        // Center the model by translating all its meshes
        const box = new THREE.Box3().setFromObject(car);
        const center = box.getCenter(new THREE.Vector3());
        
        // Move all child meshes to center the geometry
        car.traverse((child) => {
          if (child.isMesh) {
            child.geometry.translate(-center.x, -center.y, -center.z);
          }
        });
        
        // Reset model position to origin
        car.position.set(0, 0, 0);
        
        // Recalculate bounding box after centering
        const newBox = new THREE.Box3().setFromObject(car);
        const size = newBox.getSize(new THREE.Vector3());
        const newCenter = newBox.getCenter(new THREE.Vector3());
        
        // Scale to fit - make it about 3 units long
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 3 / maxDim;
        car.scale.setScalar(scale);
        
        // Add bounding box helper to visualize
        const bboxHelper = new THREE.BoxHelper(car, 0xffff00);
        scene.add(bboxHelper);
        
        // Add axes helper
        const axes = new THREE.AxesHelper(2);
        scene.add(axes);
        
        // Log for debugging
        console.log('Original center:', center.x.toFixed(1), center.y.toFixed(1), center.z.toFixed(1));
        console.log('New center:', newCenter.x.toFixed(2), newCenter.y.toFixed(2), newCenter.z.toFixed(2));
        console.log('Size:', size.x.toFixed(1), size.y.toFixed(1), size.z.toFixed(1));
        console.log('Scale:', scale.toFixed(4));
        
        scene.add(car);
        
        info.textContent = `Loaded! Size: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
        console.log('Car loaded successfully', car);
      },
      (progress) => {
        const percent = (progress.loaded / progress.total * 100).toFixed(0);
        info.textContent = `Loading: ${percent}%`;
      },
      (error) => {
        info.textContent = 'Error loading model';
        console.error('Load error:', error);
      }
    );
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    
    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
