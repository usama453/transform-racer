<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main.js Step by Step</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #00ff88; padding: 20px; font-size: 12px; }
    .step { margin: 2px 0; padding: 3px 6px; border: 1px solid #333; border-radius: 3px; }
    .pass { border-color: #00ff88; background: rgba(0,255,136,0.1); }
    .fail { border-color: #ff4444; background: rgba(255,68,68,0.1); color: #ff4444; }
    h1 { color: #fff; font-size: 14px; }
    #log { margin-top: 10px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; background: #000; padding: 10px; }
  </style>
  <script src="/libsio/socket.io.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Main.js Step by Step</h1>
  <div id="results">Waiting for main.js to load...</div>
  <div id="log"></div>

  <div id="hud">
    <div id="players-online">0</div>
    <button id="sound-toggle">&#128266;</button>
    <div id="speedometer"><div id="speed-num">0</div><div id="speed-unit">km/h</div></div>
    <div id="health-panel"><div class="health-label">HULL</div><div id="health-bar"><div id="health-fill"></div></div></div>
    <div id="nitro-panel"><div class="nitro-label">NITRO</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
    <div id="shoot-indicator" class="ready">FIRE</div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="transform-hint">Press F</div>
    <div id="warning"></div>
    <div id="spawn-capture"></div>
    <div id="edge-tags"></div>
    <div id="kill-feed"></div>
    <div id="hit-flash"></div>
    <div id="chat-box"><div id="chat-log"></div><input id="chat-input" /></div>
  </div>
  <div id="start-overlay"></div>
  <input id="name-input" />
  <button id="join-btn">JOIN</button>
  <button id="screenshake-toggle">SHAKE</button>
  <div id="server-status" class="connecting">Connecting...</div>

  <script>
    window.__debug = [];
    window.__log = function(msg) {
      window.__debug.push(msg);
      document.getElementById('log').textContent = window.__debug.join('\n');
    };
    window.onerror = function(msg, url, line) {
      window.__log('ERROR: ' + msg + ' at ' + line);
      document.getElementById('results').innerHTML += '<div class="step fail">ERROR: ' + msg + ' line ' + line + '</div>';
    };
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
